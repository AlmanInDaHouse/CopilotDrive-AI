services:
  opencar:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      TELEMETRY_MODE: ${TELEMETRY_MODE:-simulator}
      OBD_PORT: ${OBD_PORT:-}
      OBD_BAUDRATE: ${OBD_BAUDRATE:-38400}
      MAX_COOLANT_C: ${MAX_COOLANT_C:-110}
      AI_API_BASE: ${AI_API_BASE:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    # For OBD serial: add a specific USB device mapping in a private compose override.
    # Never use privileged: true or map the whole /dev directory.
